name: WattPredictor ML CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly automated retraining trigger

jobs:
  test_and_evaluate:
    name: Build, Test & Verify ML Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: |
          uv sync --frozen || uv sync
          uv pip install -e .

      - name: Run Test Suite (Pytest)
        run: |
          uv run pytest --verbose

      - name: Verify FastAPI App Syntax
        run: |
          uv run python -c "from WattPredictor.api.main import app; print('FastAPI app imported successfully')"
